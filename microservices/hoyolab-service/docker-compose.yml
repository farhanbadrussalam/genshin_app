version: "3.9"

services:
  hoyolab-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hoyolab-microservice
    restart: unless-stopped
    ports:
      # HOST_PORT:CONTAINER_PORT
      # Akses dari Laravel di: http://localhost:8001
      - "8001:8001"
    environment:
      HOST: "0.0.0.0"
      PORT: "8001"
      WORKERS: "2"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  default:
    name: genshin-network
